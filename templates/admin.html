{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Admin Dashboard</h1>
    <div class="card">
        <form method="POST">
            <table class="parcel-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Pickup</th>
                        <th>Destination</th>
                        <th>Status</th>
                        <th>Location</th>
                        <th>Update</th>
                    </tr>
                </thead>
                <tbody>
                    {% for parcel in parcels %}
                    <tr>
                        <td>#{{ parcel.id }}</td>
                        <td>{{ parcel.pickup }}</td>
                        <td>{{ parcel.destination }}</td>
                        <td>{{ parcel.status }}</td>
                        <td>
                            <input type="text" name="location_{{ parcel.id }}" value="{{ parcel.current_location or '' }}" class="form-control">
                        </td>
                        <td>
                            <select name="status_{{ parcel.id }}" class="form-control" required>
                                <option value="Pending" {% if parcel.status == 'Pending' %}selected{% endif %}>Pending</option>
                                <option value="In Transit" {% if parcel.status == 'In Transit' %}selected{% endif %}>In Transit</option>
                                <option value="Delivered" {% if parcel.status == 'Delivered' %}selected{% endif %}>Delivered</option>
                                <option value="Cancelled" {% if parcel.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <button type="submit" class="btn btn-secondary">Save Updates</button>
        </form>
    </div>
</div>
{% endblock %}
